<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AURA Z · Classy</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=JetBrains+Mono:ital,wght@0,100..800;1,100..800&display=swap" rel="stylesheet">
    <style>
        /* ─── RESET ─── */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: "Inter", -apple-system, BlinkMacSystemFont, sans-serif;
            background: #f5f5f7;
            color: #1c1c1e;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            background-image: radial-gradient(circle at 20% 20%, rgba(0, 122, 255, 0.03) 0%, transparent 60%),
                              radial-gradient(circle at 80% 80%, rgba(175, 82, 222, 0.02) 0%, transparent 60%);
        }
        .app {
            max-width: 1100px;
            width: 100%;
            background: rgba(255, 255, 255, 0.6);
            backdrop-filter: blur(40px) saturate(1.8);
            -webkit-backdrop-filter: blur(40px) saturate(1.8);
            border-radius: 32px;
            border: 1px solid rgba(255, 255, 255, 0.3);
            box-shadow: 0 30px 80px rgba(0, 0, 0, 0.08), 0 10px 30px rgba(0, 0, 0, 0.02);
            padding: 32px 36px;
            transition: all 0.3s ease;
        }
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-track { background: rgba(0,0,0,0.02); }
        ::-webkit-scrollbar-thumb { background: rgba(0,0,0,0.08); border-radius: 10px; }

        /* ─── HEADER ─── */
        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 16px;
            margin-bottom: 24px;
        }
        .logo {
            display: flex;
            align-items: baseline;
            gap: 4px;
            font-family: "Inter", sans-serif;
            font-weight: 700;
            font-size: 22px;
            letter-spacing: -0.5px;
            color: #1c1c1e;
        }
        .logo .x {
            color: #007AFF;
            font-weight: 800;
        }
        .logo .sujal {
            color: #1c1c1e;
        }
        .logo .z {
            color: #FF2D55;
            font-weight: 800;
        }
        .logo .badge {
            font-size: 9px;
            font-weight: 600;
            color: rgba(0,0,0,0.2);
            background: rgba(0,0,0,0.03);
            padding: 2px 12px;
            border-radius: 40px;
            margin-left: 6px;
            letter-spacing: 1px;
            border: 1px solid rgba(0,0,0,0.02);
        }
        .stats {
            display: flex;
            gap: 28px;
            align-items: center;
            flex-wrap: wrap;
        }
        .stat {
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .stat .num {
            font-family: "JetBrains Mono", monospace;
            font-weight: 600;
            font-size: 20px;
            line-height: 1.2;
            color: #1c1c1e;
        }
        .stat .num.blue { color: #007AFF; }
        .stat .num.green { color: #34C759; }
        .stat .num.amber { color: #FF9500; }
        .stat .lbl {
            font-size: 8px;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: rgba(0,0,0,0.2);
            font-weight: 600;
            margin-top: 2px;
        }

        /* ─── ACTIONS ─── */
        .actions {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
            margin-bottom: 24px;
        }
        .btn {
            font-family: "Inter", sans-serif;
            font-weight: 500;
            font-size: 12px;
            padding: 8px 18px;
            border-radius: 40px;
            border: 1px solid rgba(0,0,0,0.04);
            background: rgba(255,255,255,0.5);
            color: #1c1c1e;
            cursor: pointer;
            transition: all 0.25s ease;
            backdrop-filter: blur(8px);
            box-shadow: 0 1px 2px rgba(0,0,0,0.02);
        }
        .btn:hover {
            background: #ffffff;
            border-color: rgba(0,0,0,0.08);
            box-shadow: 0 4px 16px rgba(0,0,0,0.04);
            transform: translateY(-1px);
        }
        .btn-primary {
            background: #007AFF;
            border-color: #007AFF;
            color: #fff;
            box-shadow: 0 4px 16px rgba(0, 122, 255, 0.15);
        }
        .btn-primary:hover {
            background: #0066CC;
            border-color: #0066CC;
            box-shadow: 0 8px 24px rgba(0, 122, 255, 0.2);
        }
        .btn-success {
            background: #34C759;
            border-color: #34C759;
            color: #fff;
            box-shadow: 0 4px 16px rgba(52, 199, 89, 0.15);
        }
        .btn-success:hover {
            background: #2DB84D;
            border-color: #2DB84D;
            box-shadow: 0 8px 24px rgba(52, 199, 89, 0.2);
        }
        .btn-danger {
            background: #FF2D55;
            border-color: #FF2D55;
            color: #fff;
            box-shadow: 0 4px 16px rgba(255, 45, 85, 0.12);
        }
        .btn-danger:hover {
            background: #E01A3F;
            border-color: #E01A3F;
            box-shadow: 0 8px 24px rgba(255, 45, 85, 0.2);
        }
        .btn-outline {
            background: transparent;
            border-color: rgba(0,0,0,0.04);
            color: rgba(0,0,0,0.3);
        }
        .btn-outline:hover {
            background: rgba(0,0,0,0.02);
            border-color: rgba(0,0,0,0.08);
            color: #1c1c1e;
        }
        .btn-logout {
            background: transparent;
            border-color: rgba(0,0,0,0.03);
            color: rgba(0,0,0,0.15);
            font-size: 11px;
        }
        .btn-logout:hover {
            border-color: #FF2D55;
            color: #FF2D55;
        }

        /* ─── CARD GRID ─── */
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 14px;
            margin-top: 4px;
        }

        /* ─── CARDS ─── */
        .card {
            background: rgba(255, 255, 255, 0.5);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.4);
            border-radius: 20px;
            padding: 18px 20px 16px;
            transition: all 0.35s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            box-shadow: 0 2px 8px rgba(0,0,0,0.02);
        }
        .card:hover {
            transform: translateY(-3px);
            background: rgba(255, 255, 255, 0.7);
            border-color: rgba(255, 255, 255, 0.6);
            box-shadow: 0 16px 48px rgba(0,0,0,0.04), 0 4px 12px rgba(0,0,0,0.02);
        }

        .card-top {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 8px;
        }
        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            flex-shrink: 0;
            transition: all 0.3s;
        }
        .status-dot.on {
            background: #34C759;
            box-shadow: 0 0 0 2px rgba(52, 199, 89, 0.15);
        }
        .status-dot.cooldown {
            background: #FF9500;
            box-shadow: 0 0 0 2px rgba(255, 149, 0, 0.15);
        }
        .status-dot.off {
            background: #C7C7CC;
        }
        .card-name {
            font-weight: 600;
            font-size: 14px;
            flex: 1;
            color: #1c1c1e;
            letter-spacing: -0.2px;
        }
        .card-time {
            font-family: "JetBrains Mono", monospace;
            font-size: 10px;
            color: rgba(0,0,0,0.15);
        }
        .card-stats {
            display: flex;
            gap: 14px;
            font-size: 11px;
            color: rgba(0,0,0,0.25);
            margin-bottom: 12px;
        }
        .card-stats strong {
            color: #1c1c1e;
            font-weight: 600;
        }
        .card-actions {
            display: flex;
            gap: 4px;
            flex-wrap: wrap;
        }
        .btn-sm {
            font-family: "Inter", sans-serif;
            font-weight: 500;
            font-size: 10px;
            padding: 4px 12px;
            border-radius: 40px;
            border: 1px solid rgba(0,0,0,0.03);
            background: rgba(255,255,255,0.3);
            color: rgba(0,0,0,0.3);
            cursor: pointer;
            transition: all 0.2s;
        }
        .btn-sm:hover {
            background: #ffffff;
            border-color: rgba(0,0,0,0.06);
            color: #1c1c1e;
            box-shadow: 0 2px 8px rgba(0,0,0,0.02);
        }
        .btn-sm-start {
            background: #34C759;
            border-color: #34C759;
            color: #fff;
        }
        .btn-sm-start:hover {
            background: #2DB84D;
            border-color: #2DB84D;
            color: #fff;
        }
        .btn-sm-stop {
            background: #FF2D55;
            border-color: #FF2D55;
            color: #fff;
        }
        .btn-sm-stop:hover {
            background: #E01A3F;
            border-color: #E01A3F;
            color: #fff;
        }
        .btn-sm-edit {
            background: transparent;
            border-color: rgba(0,0,0,0.03);
            color: rgba(0,0,0,0.2);
        }
        .btn-sm-edit:hover {
            border-color: rgba(0,0,0,0.08);
            color: #1c1c1e;
        }
        .btn-sm-logs {
            background: transparent;
            border-color: rgba(0,0,0,0.02);
            color: rgba(0,0,0,0.15);
        }
        .btn-sm-logs:hover {
            border-color: #007AFF;
            color: #007AFF;
        }
        .btn-sm-del {
            background: transparent;
            border-color: rgba(0,0,0,0.02);
            color: rgba(0,0,0,0.08);
            padding: 4px 8px;
        }
        .btn-sm-del:hover {
            border-color: #FF2D55;
            color: #FF2D55;
        }
        .btn-sm-expand {
            background: transparent;
            border: none;
            color: rgba(0,0,0,0.06);
            font-size: 14px;
            cursor: pointer;
            padding: 0 4px;
        }
        .btn-sm-expand:hover {
            color: rgba(0,0,0,0.15);
        }

        .card-detail {
            margin-top: 12px;
            padding-top: 12px;
            border-top: 1px solid rgba(0,0,0,0.03);
            display: none;
            font-size: 11px;
            color: rgba(0,0,0,0.2);
        }
        .card-detail.open { display: block; }
        .gc-pill {
            display: inline-block;
            background: rgba(0,0,0,0.02);
            border: 1px solid rgba(0,0,0,0.02);
            padding: 2px 10px;
            border-radius: 40px;
            margin: 2px 4px 2px 0;
            font-size: 10px;
            color: rgba(0,0,0,0.2);
        }
        .detail-line { padding: 2px 0; }
        .detail-line strong { color: rgba(0,0,0,0.4); font-weight: 500; }
        .last-action-text {
            color: #007AFF;
            font-weight: 500;
            font-size: 10px;
        }

        /* ─── LOGS ─── */
        .log-panel {
            display: none;
            margin-top: 8px;
            background: rgba(0,0,0,0.02);
            border-radius: 12px;
            overflow: hidden;
        }
        .log-panel.open { display: block; }
        .log-header {
            display: flex;
            justify-content: space-between;
            padding: 4px 12px;
            background: rgba(0,0,0,0.01);
            font-size: 9px;
            color: rgba(0,0,0,0.08);
            border-bottom: 1px solid rgba(0,0,0,0.02);
            font-weight: 500;
            letter-spacing: 0.5px;
        }
        .log-live {
            color: #34C759;
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .log-live::before {
            content: '';
            width: 4px;
            height: 4px;
            background: #34C759;
            border-radius: 50%;
            display: inline-block;
            animation: live-pulse 1.5s infinite;
        }
        @keyframes live-pulse {
            0% { opacity: 1; }
            50% { opacity: 0.2; }
            100% { opacity: 1; }
        }
        .log-box {
            height: 110px;
            overflow-y: auto;
            padding: 6px 12px;
            font-family: "JetBrains Mono", monospace;
            font-size: 9px;
            line-height: 1.8;
            color: rgba(0,0,0,0.1);
        }
        .log-line { color: rgba(0,0,0,0.08); }
        .log-line.ok { color: #34C759; }
        .log-line.err { color: #FF2D55; }
        .log-line.warn { color: #FF9500; }
        .log-line.info { color: #007AFF; }

        /* ─── EMPTY ─── */
        .empty {
            text-align: center;
            padding: 60px 20px;
            color: rgba(0,0,0,0.04);
        }
        .empty-icon { font-size: 36px; margin-bottom: 12px; opacity: 0.2; }
        .empty-text { font-size: 13px; color: rgba(0,0,0,0.06); letter-spacing: 0.5px; }

        /* ─── FOOTER ─── */
        .footer {
            text-align: center;
            margin-top: 32px;
            padding: 16px 0 4px 0;
            border-top: 1px solid rgba(0,0,0,0.02);
            font-size: 11px;
            color: rgba(0,0,0,0.08);
            letter-spacing: 1px;
        }
        .footer span {
            color: #007AFF;
            font-weight: 600;
            letter-spacing: 0.3px;
        }
        .footer .heart {
            color: #FF2D55;
            display: inline-block;
            animation: heart-beat 1.5s infinite;
        }
        @keyframes heart-beat {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.15); }
        }

        /* ─── MODAL ─── */
        .modal-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.15);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            z-index: 999;
            align-items: center;
            justify-content: center;
        }
        .modal-overlay.open { display: flex; }
        .modal {
            background: rgba(255,255,255,0.75);
            backdrop-filter: blur(40px);
            -webkit-backdrop-filter: blur(40px);
            border: 1px solid rgba(255,255,255,0.3);
            border-radius: 28px;
            padding: 28px 32px;
            width: 680px;
            max-width: 96vw;
            max-height: 90vh;
            overflow-y: auto;
            box-shadow: 0 40px 120px rgba(0,0,0,0.08);
        }
        .modal-title {
            font-size: 18px;
            font-weight: 700;
            color: #1c1c1e;
            margin-bottom: 20px;
            letter-spacing: -0.3px;
        }
        .modal-title .hl { color: #007AFF; }
        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }
        .form-group { display: flex; flex-direction: column; gap: 4px; }
        .form-group.full { grid-column: 1 / -1; }
        label {
            font-size: 10px;
            color: rgba(0,0,0,0.2);
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 0.8px;
        }
        input, textarea, select {
            background: rgba(255,255,255,0.5);
            border: 1px solid rgba(0,0,0,0.04);
            color: #1c1c1e;
            padding: 8px 12px;
            border-radius: 12px;
            font-family: "Inter", sans-serif;
            font-size: 13px;
            transition: all 0.2s;
            outline: none;
            width: 100%;
        }
        input:focus, textarea:focus {
            border-color: #007AFF;
            background: #ffffff;
            box-shadow: 0 0 0 3px rgba(0, 122, 255, 0.04);
        }
        textarea { resize: vertical; min-height: 48px; }

        .fetch-row { display: flex; gap: 8px; align-items: flex-end; flex-wrap: wrap; }
        .btn-fetch {
            background: rgba(0,122,255,0.02);
            border: 1px solid rgba(0,122,255,0.04);
            color: #007AFF;
            padding: 8px 16px;
            border-radius: 40px;
            font-weight: 500;
            cursor: pointer;
            transition: 0.2s;
            white-space: nowrap;
            font-size: 11px;
            font-family: "Inter", sans-serif;
        }
        .btn-fetch:hover { background: #007AFF; color: #fff; border-color: #007AFF; }
        #fetch-status { font-size: 10px; color: rgba(0,0,0,0.06); margin-top: 4px; }
        .gc-picker { margin-top: 8px; display: none; }
        .gc-list {
            display: flex;
            flex-direction: column;
            gap: 4px;
            max-height: 140px;
            overflow-y: auto;
        }
        .gc-item {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 6px 10px;
            background: rgba(0,0,0,0.02);
            border-radius: 10px;
            border: 1px solid rgba(0,0,0,0.02);
            cursor: pointer;
            transition: 0.2s;
            font-size: 12px;
            color: rgba(0,0,0,0.4);
        }
        .gc-item:hover { border-color: rgba(0,0,0,0.04); background: rgba(0,0,0,0.01); }
        .gc-item.selected { border-color: #007AFF; background: rgba(0,122,255,0.02); }
        .gc-item input[type=checkbox] { width: 14px; height: 14px; accent-color: #007AFF; cursor: pointer; }
        .gc-item-name { flex: 1; color: rgba(0,0,0,0.5); }
        .gc-item-id { font-size: 9px; color: rgba(0,0,0,0.06); }

        .msgs-wrap { display: flex; flex-direction: column; gap: 4px; }
        .msg-row { display: flex; gap: 4px; align-items: flex-start; }
        .msg-row textarea { flex: 1; }
        .btn-icon {
            background: rgba(0,0,0,0.01);
            border: 1px solid rgba(0,0,0,0.02);
            color: rgba(0,0,0,0.06);
            padding: 6px 10px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 12px;
        }
        .btn-icon:hover { background: rgba(255,45,85,0.04); color: #FF2D55; }

        .modal-footer {
            display: flex;
            justify-content: flex-end;
            gap: 8px;
            margin-top: 18px;
            padding-top: 14px;
            border-top: 1px solid rgba(0,0,0,0.02);
        }
        .btn-save {
            background: #007AFF;
            border: none;
            color: #fff;
            font-weight: 600;
            padding: 10px 28px;
            border-radius: 40px;
            cursor: pointer;
            transition: 0.3s;
            font-size: 13px;
            font-family: "Inter", sans-serif;
            box-shadow: 0 4px 16px rgba(0,122,255,0.1);
        }
        .btn-save:hover { background: #0066CC; transform: scale(1.02); }
        .btn-cancel {
            background: rgba(0,0,0,0.01);
            border: 1px solid rgba(0,0,0,0.02);
            color: rgba(0,0,0,0.15);
            padding: 10px 20px;
            border-radius: 40px;
            cursor: pointer;
            transition: 0.3s;
            font-size: 13px;
            font-family: "Inter", sans-serif;
        }
        .btn-cancel:hover { background: rgba(0,0,0,0.02); }

        .toggle {
            position: relative;
            width: 36px;
            height: 20px;
            background: rgba(0,0,0,0.06);
            border-radius: 40px;
            cursor: pointer;
            transition: 0.3s;
            flex-shrink: 0;
        }
        .toggle.active { background: #007AFF; }
        .toggle .knob {
            position: absolute;
            top: 2px;
            left: 2px;
            width: 16px;
            height: 16px;
            background: #fff;
            border-radius: 50%;
            transition: 0.3s;
            box-shadow: 0 1px 4px rgba(0,0,0,0.04);
        }
        .toggle.active .knob { left: 18px; }

        @media (max-width: 700px) {
            .app { padding: 20px; }
            .header { flex-direction: column; align-items: stretch; text-align: center; }
            .stats { justify-content: center; }
            .actions { justify-content: center; }
            .grid { grid-template-columns: 1fr; }
            .form-grid { grid-template-columns: 1fr; }
            .form-group.full { grid-column: auto; }
            .fetch-row { flex-wrap: wrap; }
        }
    </style>
</head>
<body>
<div class="app">
    <!-- HEADER -->
    <div class="header">
        <div class="logo">
            <span class="x">x</span><span class="sujal">SUJAL</span><span class="z">Z</span>
            <span class="badge">AURA</span>
        </div>
        <div class="stats">
            <div class="stat"><div class="num blue" id="statAccounts">0</div><div class="lbl">Accounts</div></div>
            <div class="stat"><div class="num green" id="statRunning">0</div><div class="lbl">Running</div></div>
            <div class="stat"><div class="num amber" id="statSent">0</div><div class="lbl">Sent</div></div>
        </div>
    </div>

    <!-- ACTIONS -->
    <div class="actions">
        <button class="btn btn-success" onclick="startAllBots()">▶ Start All</button>
        <button class="btn btn-danger" onclick="stopAllBots()">■ Stop All</button>
        <button class="btn btn-outline" onclick="exportBackup()">Export</button>
        <button class="btn btn-outline" onclick="document.getElementById('importInput').click()">Import</button>
        <input type="file" id="importInput" accept=".json" style="display:none;" onchange="importBackup(event)">
        <button class="btn btn-primary" onclick="openAddModal()">+ New</button>
        <a href="/logout" class="btn btn-logout" style="text-decoration:none;">Logout</a>
    </div>

    <!-- GRID -->
    <div class="grid" id="accounts-wrap"></div>

    <!-- FOOTER -->
    <div class="footer">
        ✦ MADE WITH <span class="heart">❤</span> BY <span>xSUJAL</span> ✦
    </div>
</div>

<!-- MODAL -->
<div class="modal-overlay" id="modal">
<div class="modal">
    <div class="modal-title"><span class="hl">✦</span> <span id="modal-title">Add Account</span></div>
    <div id="modalBody"></div>
</div>
</div>

<script>
// ─── SCRIPT (SAME AS BEFORE, FULLY FUNCTIONAL) ──────────
let accounts = {};
let editingId = null;
let fetchedGroups = [];
let selectedGCs = [];

function $(id) { return document.getElementById(id); }

// ─── FETCH GROUPS ──────────────────────────────────────────
async function fetchGroups() {
    const sid = document.getElementById('f-sid').value.trim();
    if (!sid) { alert('Enter Session ID first'); return; }
    const proxy = document.getElementById('f-proxy').value.trim();
    const statusEl = document.getElementById('fetch-status');
    statusEl.textContent = '⚡ Fetching...';
    statusEl.style.color = '#FF9500';
    try {
        const r = await fetch('/api/fetch-groups', {
            method: 'POST',
            headers: {'Content-Type':'application/json'},
            body: JSON.stringify({session_id: sid, acc_id: editingId || 'fetch_temp', proxy: proxy})
        });
        const d = await r.json();
        if (d.groups && d.groups.length > 0) {
            fetchedGroups = d.groups;
            statusEl.textContent = `✅ ${d.groups.length} GCs found`;
            statusEl.style.color = '#34C759';
            renderGCPicker();
            selectedGCs = [];
            const toSelect = Math.min(5, d.groups.length);
            for (let i = 0; i < toSelect; i++) {
                selectedGCs.push({id: d.groups[i].id, name: d.groups[i].name});
            }
            renderGCPicker();
            syncGroupsField();
        } else {
            statusEl.textContent = '⚠️ No GCs found';
            statusEl.style.color = '#FF9500';
        }
    } catch(e) {
        statusEl.textContent = `❌ Error: ${e.message}`;
        statusEl.style.color = '#FF2D55';
    }
}

function renderGCPicker() {
    const picker = document.getElementById('gc-picker');
    const list = document.getElementById('gc-list');
    picker.style.display = 'block';
    list.innerHTML = '';
    fetchedGroups.forEach(g => {
        const isSelected = selectedGCs.some(s => s.id === g.id);
        const item = document.createElement('div');
        item.className = 'gc-item' + (isSelected ? ' selected' : '');
        item.innerHTML = `
            <input type="checkbox" ${isSelected ? 'checked' : ''} data-id="${g.id}" data-name="${g.name}"/>
            <span class="gc-item-name">${g.name}</span>
            <span class="gc-item-id">${g.id}</span>
        `;
        const cb = item.querySelector('input');
        cb.addEventListener('change', () => toggleGC(g.id, g.name, cb, item));
        list.appendChild(item);
    });
    updateGCCount();
}

function toggleGC(id, name, cb, item) {
    if (cb.checked) {
        if (selectedGCs.length >= 5) { cb.checked = false; alert('Max 5 GCs'); return; }
        selectedGCs.push({id, name});
        item.classList.add('selected');
    } else {
        selectedGCs = selectedGCs.filter(s => s.id !== id);
        item.classList.remove('selected');
    }
    updateGCCount();
    syncGroupsField();
}

function updateGCCount() {
    const el = document.getElementById('gc-count');
    if (el) el.textContent = selectedGCs.length;
}

function syncGroupsField() {
    const el = document.getElementById('f-groups');
    if (el) el.value = selectedGCs.map(s => s.id).join('\n');
    const el2 = document.getElementById('f-gnames');
    if (el2) el2.value = selectedGCs.map(s => s.name).join('\n');
}

// ─── MESSAGES ──────────────────────────────────────────────
function addMsgField(val = '') {
    const wrap = document.getElementById('msgs-wrap');
    const row = document.createElement('div');
    row.className = 'msg-row';
    row.innerHTML = `
        <textarea placeholder="Type your message..." rows="3">${val}</textarea>
        <button class="btn-icon" onclick="this.parentElement.remove()">✕</button>
    `;
    wrap.appendChild(row);
}

function getMsgs() {
    return [...document.querySelectorAll('#msgs-wrap textarea')].map(t => t.value.trim()).filter(Boolean);
}

function setMsgs(raw) {
    document.getElementById('msgs-wrap').innerHTML = '';
    const parts = raw.split('---MSG---').map(s => s.trim()).filter(Boolean);
    if (parts.length === 0) { addMsgField('🔥 Hey! How\'s everything going?'); return; }
    parts.forEach(p => addMsgField(p));
}

// ─── MODAL ──────────────────────────────────────────────────
function openAddModal() {
    editingId = null;
    fetchedGroups = [];
    selectedGCs = [];
    document.getElementById('modal-title').textContent = 'Add Account';
    document.getElementById('f-name').value = '';
    document.getElementById('f-sid').value = '';
    document.getElementById('f-csrf').value = '';
    document.getElementById('f-proxy').value = '';
    document.getElementById('f-titles').value = '';
    document.getElementById('f-msg-min').value = '2';
    document.getElementById('f-msg-max').value = '5';
    document.getElementById('f-nc-every-msgs').value = '0';
    document.getElementById('f-cooldown-after').value = '0';
    document.getElementById('f-cooldown-dur').value = '5';
    document.getElementById('f-groups').value = '';
    document.getElementById('f-gnames').value = '';
    document.getElementById('gc-picker').style.display = 'none';
    document.getElementById('gc-list').innerHTML = '';
    document.getElementById('gc-count').textContent = '0';
    document.getElementById('fetch-status').textContent = '';
    setMsgs('');
    document.getElementById('modal').classList.add('open');
}

function openEditModal(id) {
    editingId = id;
    const acc = accounts[id];
    selectedGCs = [];
    const savedGroups = acc.groups ? acc.groups.split('\n').filter(Boolean) : [];
    const savedNames = acc.group_names ? acc.group_names.split('\n').filter(Boolean) : [];
    savedGroups.forEach((gid, i) => {
        selectedGCs.push({id: gid.trim(), name: savedNames[i] || gid.trim()});
    });
    fetchedGroups = selectedGCs.map(s => ({id: s.id, name: s.name}));

    document.getElementById('modal-title').textContent = 'Edit Account';
    document.getElementById('f-name').value = acc.name || '';
    document.getElementById('f-sid').value = acc.session_id || '';
    document.getElementById('f-csrf').value = acc.csrf_token || '';
    document.getElementById('f-proxy').value = acc.proxy || '';
    document.getElementById('f-titles').value = acc.nc_titles || '';
    document.getElementById('f-msg-min').value = acc.msg_delay_min || '2';
    document.getElementById('f-msg-max').value = acc.msg_delay_max || '5';
    document.getElementById('f-nc-every-msgs').value = acc.nc_every_msgs || '0';
    document.getElementById('f-cooldown-after').value = acc.cooldown_after || '0';
    document.getElementById('f-cooldown-dur').value = acc.cooldown_dur || '5';
    document.getElementById('f-groups').value = savedGroups.join('\n');
    document.getElementById('f-gnames').value = savedNames.join('\n');
    document.getElementById('fetch-status').textContent = '';

    if (selectedGCs.length > 0) {
        renderGCPicker();
    } else {
        document.getElementById('gc-picker').style.display = 'none';
    }
    setMsgs(acc.messages || '');
    document.getElementById('modal').classList.add('open');
}

function closeModal() {
    document.getElementById('modal').classList.remove('open');
    editingId = null;
}

function toggleScheduleSwitch() {
    const toggle = document.getElementById('scheduleToggle');
    const hidden = document.getElementById('f-schedule-enabled');
    toggle.classList.toggle('active');
    hidden.value = toggle.classList.contains('active') ? 'true' : 'false';
    if (toggle.classList.contains('active')) {
        toggle.style.background = '#007AFF';
        toggle.querySelector('.knob').style.left = '18px';
    } else {
        toggle.style.background = 'rgba(0,0,0,0.06)';
        toggle.querySelector('.knob').style.left = '2px';
    }
}

// ─── SAVE ──────────────────────────────────────────────────
async function saveAccount() {
    const msgs = getMsgs();
    if (!msgs.length) { alert('Add at least one message'); return; }

    let finalGroups = selectedGCs;
    if (finalGroups.length === 0) {
        const manualGroups = document.getElementById('f-groups').value.trim();
        const manualNames = document.getElementById('f-gnames').value.trim();
        if (manualGroups) {
            const gids = manualGroups.split('\n').filter(Boolean);
            const gnames = manualNames ? manualNames.split('\n').filter(Boolean) : [];
            finalGroups = gids.map((id, i) => ({
                id: id.trim(),
                name: gnames[i] ? gnames[i].trim() : id.trim()
            }));
        }
    }

    const body = {
        name: document.getElementById('f-name').value.trim(),
        session_id: document.getElementById('f-sid').value.trim(),
        csrf_token: document.getElementById('f-csrf').value.trim(),
        proxy: document.getElementById('f-proxy').value.trim(),
        groups: finalGroups.map(s => s.id).join('\n'),
        group_names: finalGroups.map(s => s.name).join('\n'),
        nc_titles: document.getElementById('f-titles').value.trim(),
        messages: msgs.join('---MSG---'),
        msg_delay_min: parseFloat(document.getElementById('f-msg-min').value),
        msg_delay_max: parseFloat(document.getElementById('f-msg-max').value),
        nc_every_msgs: parseInt(document.getElementById('f-nc-every-msgs').value),
        cooldown_after: parseInt(document.getElementById('f-cooldown-after').value),
        cooldown_dur: parseFloat(document.getElementById('f-cooldown-dur').value),
        schedule_enabled: document.getElementById('f-schedule-enabled').value === 'true',
        schedule_start: document.getElementById('f-schedule-start').value,
        schedule_stop: document.getElementById('f-schedule-stop').value,
    };

    if (!body.name) { alert('Enter account name'); return; }
    if (!body.session_id && !editingId) { alert('Session ID required'); return; }

    const url = editingId ? `/api/accounts/${editingId}` : '/api/accounts';
    const method = editingId ? 'PUT' : 'POST';
    const r = await fetch(url, {method, headers:{'Content-Type':'application/json'}, body: JSON.stringify(body)});
    const d = await r.json();
    if (d.success) { closeModal(); loadAccounts(); }
    else alert(d.error || 'Save failed');
}

// ─── CONTROLS ──────────────────────────────────────────────
async function startBot(id) {
    const r = await fetch(`/api/accounts/${id}/start`, {method:'POST'});
    const d = await r.json();
    if (!d.success) alert(d.error || 'Start failed');
}

async function stopBot(id) {
    await fetch(`/api/accounts/${id}/stop`, {method:'POST'});
}

async function deleteAcc(id) {
    if (!confirm('Delete this account?')) return;
    await fetch(`/api/accounts/${id}`, {method:'DELETE'});
    loadAccounts();
}

function toggleLogs(id) {
    const el = document.getElementById(`log-panel-${id}`);
    if (el) el.classList.toggle('open');
}

function toggleDetail(id) {
    const el = document.getElementById(`detail-${id}`);
    if (el) el.classList.toggle('open');
}

async function startAllBots() {
    if (!confirm('Start all bots?')) return;
    await fetch('/api/accounts/start-all', {method:'POST'});
    loadAccounts();
}

async function stopAllBots() {
    if (!confirm('Stop all bots?')) return;
    await fetch('/api/accounts/stop-all', {method:'POST'});
    loadAccounts();
}

async function exportBackup() {
    const r = await fetch('/api/backup/export');
    const data = await r.json();
    const blob = new Blob([JSON.stringify(data, null, 2)], {type:'application/json'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `aura_z_backup_${new Date().toISOString().slice(0,10)}.json`;
    a.click();
    URL.revokeObjectURL(url);
}

async function importBackup(event) {
    const file = event.target.files[0];
    if (!file) return;
    const text = await file.text();
    const data = JSON.parse(text);
    if (!data.accounts) { alert('Invalid backup'); return; }
    await fetch('/api/backup/import', {
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body:JSON.stringify({data: data})
    });
    alert('Backup imported!');
    loadAccounts();
}

// ─── RENDER ─────────────────────────────────────────────────
function fmtTime(secs) {
    if (!secs || secs < 0) return '--:--:--';
    const h = Math.floor(secs/3600);
    const m = Math.floor((secs%3600)/60);
    const s = Math.floor(secs%60);
    return `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
}

function renderAccounts(data) {
    const wrap = document.getElementById('accounts-wrap');
    const ids = Object.keys(data);

    if (ids.length === 0) {
        wrap.innerHTML = `<div class="empty"><div class="empty-icon">✦</div><div class="empty-text">No accounts yet.<br>Click "New" to get started.</div></div>`;
        return;
    }

    let totalRunning = 0, totalSent = 0;
    ids.forEach(id => {
        const st = data[id].status || {};
        if (st.running) totalRunning++;
        totalSent += st.sent || 0;
    });
    document.getElementById('statAccounts').textContent = ids.length;
    document.getElementById('statRunning').textContent = totalRunning;
    document.getElementById('statSent').textContent = totalSent;

    ids.forEach(id => {
        const acc = data[id];
        const st = acc.status || {};
        const dot = st.running ? 'on' : (st.cooldown ? 'cooldown' : 'off');
        const runtime = st.runtime_secs ? fmtTime(st.runtime_secs) : '--:--:--';
        const cooldownStr = st.cooldown && st.cooldown_remaining > 0 ? ' 😴 ' + fmtTime(st.cooldown_remaining) : '';
        const gcNames = acc.group_names ? acc.group_names.split('\n').filter(Boolean) : [];

        let existing = document.getElementById(`card-${id}`);
        if (!existing) {
            existing = document.createElement('div');
            existing.className = 'card';
            existing.id = `card-${id}`;
            wrap.appendChild(existing);
        }

        const logOpen = document.getElementById(`log-panel-${id}`)?.classList.contains('open') || false;
        const detailOpen = document.getElementById(`detail-${id}`)?.classList.contains('open') || false;

        existing.innerHTML = `
            <div class="card-top">
                <div class="status-dot ${dot}"></div>
                <div class="card-name">${acc.name || id} ${cooldownStr}</div>
                <div class="card-time">${runtime}</div>
            </div>
            <div class="card-stats">
                <span><strong>${st.sent||0}</strong> sent</span>
                <span><strong>${st.failed||0}</strong> fail</span>
                <span><strong>${st.nc_done||0}</strong> NC</span>
            </div>
            <div class="card-actions">
                ${st.running ? `<button class="btn-sm btn-sm-stop" onclick="stopBot('${id}')">Stop</button>` : `<button class="btn-sm btn-sm-start" onclick="startBot('${id}')">Start</button>`}
                <button class="btn-sm btn-sm-logs" onclick="toggleLogs('${id}')">Logs</button>
                <button class="btn-sm btn-sm-edit" onclick="openEditModal('${id}')">Edit</button>
                <button class="btn-sm btn-sm-del" onclick="deleteAcc('${id}')">✕</button>
                <button class="btn-sm btn-sm-expand" onclick="toggleDetail('${id}')">⌃</button>
            </div>
            <div class="card-detail ${detailOpen ? 'open' : ''}" id="detail-${id}">
                ${gcNames.length ? `<div>${gcNames.map(n=>`<span class="gc-pill">${n}</span>`).join('')}</div>` : ''}
                <div class="detail-line"><strong>Delay:</strong> ${acc.msg_delay_min||2}s – ${acc.msg_delay_max||5}s</div>
                ${acc.cooldown_after > 0 ? `<div class="detail-line"><strong>Cooldown:</strong> ${acc.cooldown_after} → ${acc.cooldown_dur}min</div>` : ''}
                ${acc.nc_titles ? `<div class="detail-line"><strong>NC Titles:</strong> ${acc.nc_titles.split(',').length}</div>` : ''}
                ${acc.schedule_enabled ? `<div class="detail-line"><strong>Schedule:</strong> ${acc.schedule_start || '09:00'} → ${acc.schedule_stop || '18:00'}</div>` : ''}
                <div class="last-action-text">❯ ${st.last_action || 'Idle'}</div>
                <div class="log-panel ${logOpen ? 'open' : ''}" id="log-panel-${id}">
                    <div class="log-header"><span>Console</span><span class="log-live">LIVE</span></div>
                    <div class="log-box" id="log-box-${id}"></div>
                </div>
            </div>
        `;
    });

    wrap.querySelectorAll('.card').forEach(el => {
        if (!data[el.id.replace('card-','')]) el.remove();
    });
}

function colorLog(line) {
    if (line.includes('✅') || line.includes('✓')) return 'ok';
    if (line.includes('❌') || line.includes('failed')) return 'err';
    if (line.includes('⚠️')) return 'warn';
    if (line.includes('🔄')) return 'info';
    if (line.includes('💤') || line.includes('😴')) return 'info';
    return '';
}

// ─── POLLING ─────────────────────────────────────────────────
async function loadAccounts() {
    try {
        const r = await fetch('/api/accounts');
        accounts = await r.json();
        renderAccounts(accounts);
    } catch(e) { console.error(e); }
}

async function pollLogs() {
    document.querySelectorAll('.log-panel.open').forEach(panel => {
        const id = panel.id.replace('log-panel-','');
        fetch(`/api/accounts/${id}/logs`).then(r => r.json()).then(d => {
            const box = document.getElementById(`log-box-${id}`);
            if (box && d.logs) {
                const current = box.querySelectorAll('.log-line').length;
                if (current === 0) {
                    box.innerHTML = d.logs.map(l => `<div class="log-line ${colorLog(l)}">${l}</div>`).join('');
                    box.scrollTop = box.scrollHeight;
                } else if (d.logs.length > current) {
                    const newLines = d.logs.slice(current);
                    newLines.forEach(l => {
                        const div = document.createElement('div');
                        div.className = `log-line ${colorLog(l)}`;
                        div.textContent = l;
                        box.appendChild(div);
                    });
                    if (box.scrollHeight - box.scrollTop - box.clientHeight < 40) box.scrollTop = box.scrollHeight;
                }
            }
        }).catch(()=>{});
    });
}
