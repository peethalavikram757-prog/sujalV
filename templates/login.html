<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AURA Z · Login</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', sans-serif;
            background: #0a0a12;
            color: #e8edf5;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background-image: radial-gradient(circle at 20% 20%, rgba(79,140,255,0.06) 0%, transparent 60%),
                              radial-gradient(circle at 80% 80%, rgba(255,59,92,0.04) 0%, transparent 60%);
        }
        .login-box {
            background: rgba(12,18,34,0.6);
            backdrop-filter: blur(40px);
            -webkit-backdrop-filter: blur(40px);
            border: 1px solid rgba(255,255,255,0.04);
            border-radius: 32px;
            padding: 40px;
            width: 380px;
            max-width: 90vw;
            text-align: center;
            box-shadow: 0 30px 80px rgba(0,0,0,0.6);
        }
        .logo {
            font-family: 'JetBrains Mono', monospace;
            font-size: 32px;
            font-weight: 800;
            margin-bottom: 8px;
            letter-spacing: -1px;
        }
        .logo .x { color: #4f8cff; }
        .logo .sujal { color: #e8edf5; }
        .logo .z { color: #ff453a; }
        .subtitle {
            font-size: 13px;
            color: rgba(255,255,255,0.08);
            margin-bottom: 28px;
            letter-spacing: 4px;
            font-weight: 500;
        }
        input {
            width: 100%;
            padding: 12px 16px;
            background: rgba(0,0,0,0.3);
            border: 1px solid rgba(255,255,255,0.04);
            border-radius: 14px;
            color: #e8edf5;
            font-size: 14px;
            outline: none;
            transition: 0.2s;
            font-family: 'Inter', sans-serif;
        }
        input:focus {
            border-color: #4f8cff;
            box-shadow: 0 0 0 3px rgba(79,140,255,0.04);
        }
        button {
            width: 100%;
            padding: 12px;
            background: #4f8cff;
            border: none;
            border-radius: 14px;
            color: #0a0a12;
            font-weight: 700;
            font-size: 14px;
            cursor: pointer;
            transition: 0.2s;
            margin-top: 12px;
            font-family: 'Inter', sans-serif;
            box-shadow: 0 4px 20px rgba(79,140,255,0.1);
        }
        button:hover { background: #3a7ae6; transform: translateY(-1px); }
        .made-by {
            margin-top: 24px;
            font-size: 11px;
            color: rgba(255,255,255,0.02);
            letter-spacing: 2px;
        }
        .made-by span { color: #4f8cff; font-weight: 600; }
    </style>
</head>
<body>
    <div class="login-box">
        <div class="logo"><span class="x">x</span><span class="sujal">SUJAL</span><span class="z">Z</span></div>
        <div class="subtitle">AURA Z · COMMAND CENTER</div>
        <form method="post">
            <input type="password" name="password" placeholder="Enter Password" required autofocus>
            <button type="submit">⚡ UNLOCK</button>
        </form>
        <div class="made-by">✦ MADE BY <span>xSUJAL</span> ✦</div>
    </div>
</body>
</html>
